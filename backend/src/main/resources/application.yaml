spring:
  application:
    name: Backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/boutique_pos}
    username: ${DB_USERNAME:boutique_user}
    password: ${APP_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  sql:
    init:
      mode: never

  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml
